# docker-compose.yml for Kenya GovDash
# Self-hosted deployment with SQLite (persistent volume)
#
# REQUIRED: create a .env file with at least:
#   JWT_SECRET=<openssl rand -hex 32>
#   ADMIN_PASSWORD_HASH=<bcrypt hash of your password>
# The container will not start admin auth without these.

version: '3.8'

services:
  app:
    build: .
    container_name: kenya-govdash
    ports:
      - "3000:3000"
    environment:
      # Database (SQLite — stored in ./data volume)
      - DATABASE_URL=file:/app/data/govdash.db

      # Auth — MUST be provided via host .env (no insecure defaults)
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env}

      # AI (optional)
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}

      # Email (optional)
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-Kenya GovDash <noreply@localhost>}
      - MAIL_REPLY_TO=${MAIL_REPLY_TO:-}

      # Cron (optional)
      - CRON_SECRET=${CRON_SECRET:-}

      # Public URL
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}

      # Trust reverse proxy headers when behind Caddy/nginx
      - TRUST_PROXY=${TRUST_PROXY:-1}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
